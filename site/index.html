<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOP-SKILLS · Claude Code 技能库</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<style>
/* ===== Reset & Variables ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1c2333;
  --border: #30363d; --text: #e6edf3; --text-dim: #8b949e;
  --accent: #58a6ff; --accent-green: #3fb950; --accent-orange: #d29922;
  --accent-purple: #bc8cff; --radius: 8px; --shadow: 0 1px 3px rgba(0,0,0,0.3);
}
html { font-size: 14px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ===== Layout ===== */
.container { max-width: 1280px; margin: 0 auto; padding: 0 20px; }

/* ===== Header ===== */
header {
  border-bottom: 1px solid var(--border); padding: 16px 0;
  background: var(--bg-card); position: sticky; top: 0; z-index: 100;
}
header .container { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
header h1 { font-size: 1.4rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
header h1 span { color: var(--accent); }
.header-info { color: var(--text-dim); font-size: 0.85rem; }
.header-info strong { color: var(--text); }
.lang-toggle {
  padding: 4px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text-dim); cursor: pointer;
  font-size: 0.8rem; font-family: inherit; transition: all 0.15s;
}
.lang-toggle:hover { border-color: var(--accent); color: var(--accent); }

/* ===== Navigation Tabs ===== */
.tabs { display: flex; gap: 4px; margin-top: 20px; border-bottom: 1px solid var(--border); }
.tab-btn {
  padding: 10px 20px; cursor: pointer; background: none; border: none;
  color: var(--text-dim); font-size: 0.9rem; border-bottom: 2px solid transparent;
  transition: all 0.2s; font-family: inherit;
}
.tab-btn:hover { color: var(--text); background: var(--bg-hover); border-radius: 6px 6px 0 0; }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { display: none; padding: 20px 0; }
.tab-content.active { display: block; }

/* ===== Stats Cards ===== */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; text-align: center; transition: transform 0.15s;
}
.stat-card:hover { transform: translateY(-2px); }
.stat-card .number { font-size: 2rem; font-weight: 700; color: var(--accent); }
.stat-card .label { color: var(--text-dim); font-size: 0.8rem; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card.green .number { color: var(--accent-green); }
.stat-card.orange .number { color: var(--accent-orange); }
.stat-card.purple .number { color: var(--accent-purple); }

/* ===== Chart Row ===== */
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.chart-box {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; position: relative;
}
.chart-box:has(canvas) {
  height: 300px; display: flex; flex-direction: column;
}
.chart-box:has(canvas) canvas {
  flex: 1; width: 100% !important; max-height: 100% !important;
}
.chart-box h3 { font-size: 0.9rem; color: var(--text-dim); margin-bottom: 12px; flex-shrink: 0; }

/* ===== Source Table ===== */
.source-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
.source-table th, .source-table td {
  text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}
.source-table th { color: var(--text-dim); font-weight: 500; }
.source-table tr:hover td { background: var(--bg-hover); }
.source-bar {
  height: 20px; border-radius: 4px; display: inline-block;
  min-width: 4px; transition: width 0.3s;
}

/* ===== Browse Section ===== */
.browse-toolbar {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  margin-bottom: 16px; padding: 12px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius);
}
.search-input {
  flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--bg); color: var(--text);
  font-size: 0.9rem; font-family: inherit;
}
.search-input:focus { outline: none; border-color: var(--accent); }
.filter-select {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); font-size: 0.85rem; cursor: pointer;
  font-family: inherit;
}
.view-btns { display: flex; gap: 2px; }
.view-btn {
  padding: 6px 10px; border: 1px solid var(--border); background: var(--bg);
  color: var(--text-dim); cursor: pointer; font-size: 0.85rem;
}
.view-btn:first-child { border-radius: 6px 0 0 6px; }
.view-btn:last-child { border-radius: 0 6px 6px 0; }
.view-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.result-count { color: var(--text-dim); font-size: 0.85rem; margin-left: auto; }

/* ===== Skill Cards Grid ===== */
.skills-grid { display: grid; gap: 12px; }
.skills-grid.grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.skills-grid.list { grid-template-columns: 1fr; }

.skill-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; cursor: pointer; transition: all 0.15s;
  display: flex; flex-direction: column; gap: 8px;
}
.skill-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
.skill-card.list { flex-direction: row; align-items: center; gap: 16px; }
.skill-card.list .skill-meta { margin-left: auto; flex-shrink: 0; }

.skill-name { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.skill-source {
  font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
  background: rgba(88,166,255,0.15); color: var(--accent); white-space: nowrap;
}
.repo-link {
  color: var(--text-dim); text-decoration: none; font-size: 0.85rem;
  margin-left: 4px; transition: color 0.15s; line-height: 1;
}
.repo-link:hover { color: var(--accent); }
.skill-desc { color: var(--text-dim); font-size: 0.85rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.skill-meta { display: flex; gap: 12px; font-size: 0.78rem; color: var(--text-dim); }
.skill-meta span { display: flex; align-items: center; gap: 4px; }

/* ===== Pagination ===== */
.pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 20px; }
.page-btn {
  padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-card); color: var(--text); cursor: pointer; font-family: inherit;
  transition: all 0.15s;
}
.page-btn:hover { background: var(--bg-hover); }
.page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.page-btn:disabled { opacity: 0.4; cursor: default; }
.page-info { color: var(--text-dim); font-size: 0.85rem; }

/* ===== Modal ===== */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 200; justify-content: center; align-items: flex-start;
  padding: 40px 20px; overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal-content {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; max-width: 800px; width: 100%; padding: 32px;
  position: relative; margin-top: 20px;
}
.modal-close {
  position: absolute; top: 16px; right: 20px; background: none; border: none;
  color: var(--text-dim); font-size: 1.5rem; cursor: pointer; padding: 4px 8px;
  line-height: 1;
}
.modal-close:hover { color: var(--text); }
.modal-tabs { display: flex; gap: 2px; margin-top: 12px; border-bottom: 1px solid var(--border); }
.modal-tab-btn {
  padding: 6px 16px; cursor: pointer; background: none; border: none;
  color: var(--text-dim); font-size: 0.82rem; border-bottom: 2px solid transparent;
  transition: all 0.15s; font-family: inherit;
}
.modal-tab-btn:hover { color: var(--text); background: var(--bg-hover); border-radius: 4px 4px 0 0; }
.modal-tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.modal-tab-panel { display: none; }
.modal-tab-panel.active { display: block; }
.modal-header { margin-bottom: 20px; }
.modal-header h2 { font-size: 1.3rem; margin-bottom: 4px; }
.modal-header .subtitle { color: var(--text-dim); font-size: 0.85rem; }
.modal-body { line-height: 1.7; color: var(--text); font-size: 0.9rem; }
.modal-body h1, .modal-body h2, .modal-body h3 { margin-top: 20px; margin-bottom: 10px; }
.modal-body h1 { font-size: 1.3rem; } .modal-body h2 { font-size: 1.1rem; } .modal-body h3 { font-size: 1rem; }
.modal-body p { margin-bottom: 12px; }
.modal-body ul, .modal-body ol { padding-left: 20px; margin-bottom: 12px; }
.modal-body code { background: rgba(88,166,255,0.15); padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
.modal-body pre {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 16px; overflow-x: auto; margin-bottom: 12px; font-size: 0.85rem;
}
.modal-body blockquote {
  border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-dim); margin: 12px 0;
}
.modal-files { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
.modal-files h4 { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 8px; }
.file-list { display: flex; flex-wrap: wrap; gap: 6px; }
.file-tag {
  padding: 3px 10px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 4px; font-size: 0.78rem; color: var(--text-dim);
  font-family: monospace;
}

/* ===== Trends ===== */
.trend-charts { display: grid; gap: 16px; }

/* ===== Loading ===== */
.loading { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.loading .spinner {
  width: 40px; height: 40px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== No Data ===== */
.no-data { text-align: center; padding: 40px; color: var(--text-dim); font-size: 0.9rem; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .chart-row { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .skills-grid.grid { grid-template-columns: 1fr; }
  header .container { flex-direction: column; align-items: flex-start; }
  .browse-toolbar { flex-direction: column; }
  .result-count { margin-left: 0; }
}
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header>
  <div class="container">
    <h1>TOP-SKILLS</h1>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div class="header-info" id="headerInfo">
        共 <strong id="headerTotal">-</strong> 个 Claude Code 技能 · 最后更新 <span id="headerUpdate">-</span>
      </div>
      <button class="lang-toggle" id="langToggle" onclick="switchLang()">English</button>
    </div>
  </div>
</header>

<div class="container">

<!-- ===== Tabs ===== -->
<div class="tabs">
  <button class="tab-btn active" data-tab="dashboard" id="tabBtnDashboard">概览</button>
  <button class="tab-btn" data-tab="browse" id="tabBtnBrowse">浏览</button>
  <button class="tab-btn" data-tab="trends" id="tabBtnTrends">趋势</button>
</div>

<!-- ===== Dashboard Tab ===== -->
<section id="tab-dashboard" class="tab-content active">
  <div class="stats-grid" id="statsGrid"></div>
  <div class="chart-row">
    <div class="chart-box"><h3 id="chartSourceTitle">各来源技能分布</h3><canvas id="sourceChart"></canvas></div>
    <div class="chart-box"><h3 id="chartGrowthTitle">技能增长趋势</h3><canvas id="growthChart"></canvas></div>
  </div>
  <div class="chart-box">
    <h3 id="sourceTableTitle">来源仓库详情</h3>
    <div id="sourceTable"></div>
  </div>
</section>

<!-- ===== Browse Tab ===== -->
<section id="tab-browse" class="tab-content">
  <div class="browse-toolbar">
    <input class="search-input" id="searchInput" placeholder="搜索技能名称或描述..." autofocus>
    <select class="filter-select" id="sourceFilter"><option value="" id="allSourcesOpt">所有来源</option></select>
    <select class="filter-select" id="sortSelect">
      <option value="name" id="sortNameAsc">名称 ↑</option>
      <option value="-name" id="sortNameDesc">名称 ↓</option>
      <option value="updated" id="sortUpdated">最近更新</option>
      <option value="first_seen" id="sortNewest">最新添加</option>
      <option value="files" id="sortFiles">文件数</option>
    </select>
    <div class="view-btns">
      <button class="view-btn active" data-view="grid" id="viewGrid">▦ 网格</button>
      <button class="view-btn" data-view="list" id="viewList">☰ 列表</button>
    </div>
    <span class="result-count" id="resultCount"></span>
  </div>
  <div class="skills-grid grid" id="skillsContainer"></div>
  <div class="pagination" id="pagination"></div>
</section>

<!-- ===== Trends Tab ===== -->
<section id="tab-trends" class="tab-content">
  <div class="trend-charts">
    <div class="chart-row">
      <div class="chart-box"><h3 id="dailyChartTitle">每日新增技能</h3><canvas id="dailyChart"></canvas></div>
      <div class="chart-box"><h3 id="sourceTrendTitle">各来源增长趋势</h3><canvas id="sourceTrendChart"></canvas></div>
    </div>
    <div class="chart-box">
      <h3 id="hotReposTitle">热门来源仓库</h3>
      <div id="hotRepos"></div>
    </div>
  </div>
</section>

</div>

<!-- ===== Modal ===== -->
<div class="modal-overlay" id="skillModal">
  <div class="modal-content">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <div class="subtitle" id="modalSubtitle"></div>
      <div class="modal-tabs" id="modalTabs">
        <button class="modal-tab-btn active" data-mtab="original" id="modalTabOriginal">原文</button>
        <button class="modal-tab-btn" data-mtab="chinese" id="modalTabChinese">中文概览</button>
      </div>
    </div>
    <div id="modalBodyOriginal" class="modal-body modal-tab-panel active"></div>
    <div id="modalBodyChinese" class="modal-body modal-tab-panel"></div>
    <div class="modal-files" id="modalFiles"></div>
  </div>
</div>

<div hidden><span id="busuanzi_value_site_pv"></span><span id="busuanzi_value_site_uv"></span></div>

<script>
// ======================================================================
//  i18n
// ======================================================================
const LANG = { zh: 0, en: 1 };
let currentLang = 'zh';

const I18N = {
  // Header
  headerInfo:     ['共 {total} 个 Claude Code 技能 · 最后更新 {date}', '{total} Claude Code skills · Last updated {date}'],
  langToggle:     ['English', '中文'],

  // Tabs
  tabDashboard:   ['概览', 'Dashboard'],
  tabBrowse:      ['浏览', 'Browse'],
  tabTrends:      ['趋势', 'Trends'],

  // Dashboard cards
  statTotal:      ['技能总数', 'Total Skills'],
  statSources:    ['来源仓库', 'Sources'],
  statFiles:      ['文件总数', 'Total Files'],
  statReadTime:   ['平均阅读时长(分钟)', 'Avg Read Time (min)'],
  statVisits:     ['访问总量', 'Total Visits'],
  statVisitors:   ['访客数', 'Visitors'],

  // Dashboard charts
  chartSource:    ['各来源技能分布', 'Skills by Source'],
  chartGrowth:    ['技能增长趋势', 'Growth Trend'],
  chartGrowthLabel: ['技能总数', 'Total Skills'],

  // Dashboard source table
  sourceTableTitle: ['来源仓库详情', 'Source Repository Details'],
  colSource:      ['来源', 'Source'],
  colRepo:        ['仓库', 'Repository'],
  colDesc:        ['仓库描述', 'Description'],
  colSkills:      ['技能数', 'Skills'],
  colShare:       ['占比', 'Share'],

  // Browse
  searchPlaceholder: ['搜索技能名称或描述...', 'Search skill name or description...'],
  allSources:     ['所有来源', 'All Sources'],
  sortNameAsc:    ['名称 ↑', 'Name ↑'],
  sortNameDesc:   ['名称 ↓', 'Name ↓'],
  sortUpdated:    ['最近更新', 'Recently Updated'],
  sortNewest:     ['最新添加', 'Latest Added'],
  sortFiles:      ['文件数', 'Files'],
  viewGrid:       ['▦ 网格', '▦ Grid'],
  viewList:       ['☰ 列表', '☰ List'],
  resultCount:    ['共 {n} 个技能', '{n} skills total'],
  noMatch:        ['没有找到匹配的技能', 'No matching skills found'],

  // Skill card
  files:          ['文件', 'files'],
  minutes:        ['分钟', 'min'],

  // Trends
  dailyTitle:     ['每日新增技能', 'Daily New Skills'],
  sourceTrendTitle: ['各来源增长趋势', 'Growth by Source'],
  hotReposTitle:  ['热门来源仓库', 'Top Source Repos'],
  noTimeline:     ['暂无足够的历史数据', 'Insufficient historical data'],
  noDaily:        ['暂无每日新增数据', 'No daily data'],
  noPerSource:    ['暂无各来源增长数据', 'No per-source data'],
  noActivity:     ['暂无仓库活动数据', 'No activity data'],
  dailyLabel:     ['新增技能', 'New Skills'],

  // Hot repos table
  colRank:        ['排名', 'Rank'],
  colNewSkills:   ['新增技能', 'New Skills'],
  colCommits:     ['提交次数', 'Commits'],
  colLastActive:  ['最后活跃', 'Last Active'],

  // Modal
  modalTabOrig:   ['原文', 'Original'],
  modalTabCN:     ['中文概览', 'Chinese Summary'],
  noContent:      ['暂无内容', 'No content'],
  noSummary:      ['暂无中文摘要', 'No Chinese summary'],
  fileList:       ['文件列表 ({n})', 'Files ({n})'],
  modalSource:    ['来源', 'Source'],
  modalFiles:     ['文件', 'files'],
  modalReadTime:  ['分钟阅读', 'min read'],
  modalAdded:     ['添加', 'Added'],
  modalUpdated:   ['更新', 'Updated'],
  viewRepo:       ['查看仓库 ↗', 'View Repo ↗'],
};

function t(key, ...args) {
  const idx = currentLang === 'zh' ? 0 : 1;
  let s = I18N[key] ? I18N[key][idx] : key;
  if (args.length) {
    args.forEach((v, i) => { s = s.replace(`{${['n','total','date','count'].length > i ? ['n','total','date','count'][i] : i}}`, v); });
    s = s.replace(/\{(\w+)\}/g, (_, k) => args[0] || '');
  }
  return s;
}

function switchLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  document.getElementById('langToggle').textContent = t('langToggle');
  applyLang();
}

function applyLang() {
  // Header
  const total = document.getElementById('headerTotal').textContent;
  const date = document.getElementById('headerUpdate').textContent;
  document.getElementById('headerInfo').innerHTML = t('headerInfo').replace('{total}', total).replace('{date}', date);

  // Tabs
  document.getElementById('tabBtnDashboard').textContent = t('tabDashboard');
  document.getElementById('tabBtnBrowse').textContent = t('tabBrowse');
  document.getElementById('tabBtnTrends').textContent = t('tabTrends');

  // Chart titles
  document.getElementById('chartSourceTitle').textContent = t('chartSource');
  document.getElementById('chartGrowthTitle').textContent = t('chartGrowth');
  document.getElementById('sourceTableTitle').textContent = t('sourceTableTitle');

  // Browse
  document.getElementById('searchInput').placeholder = t('searchPlaceholder');
  document.getElementById('allSourcesOpt').textContent = t('allSources');
  document.getElementById('sortNameAsc').textContent = t('sortNameAsc');
  document.getElementById('sortNameDesc').textContent = t('sortNameDesc');
  document.getElementById('sortUpdated').textContent = t('sortUpdated');
  document.getElementById('sortNewest').textContent = t('sortNewest');
  document.getElementById('sortFiles').textContent = t('sortFiles');
  document.getElementById('viewGrid').textContent = t('viewGrid');
  document.getElementById('viewList').textContent = t('viewList');

  // Trends
  document.getElementById('dailyChartTitle').textContent = t('dailyTitle');
  document.getElementById('sourceTrendTitle').textContent = t('sourceTrendTitle');
  document.getElementById('hotReposTitle').textContent = t('hotReposTitle');

  // Modal tabs
  document.getElementById('modalTabOriginal').textContent = t('modalTabOrig');
  document.getElementById('modalTabChinese').textContent = t('modalTabCN');

  // Re-render dynamic content
  renderDashboard(DATA.stats, DATA.skills, DATA.timeline);
  if (document.querySelector('#tab-browse.tab-content.active')) renderBrowse();
  renderTrends();
}
</script>
<script>
// ======================================================================
//  Data & Chart Instance Management
// ======================================================================
let DATA = null;
window._charts = {};
let visitorCount = null;
let visitorUV = null;

function updateVisitorDisplay() {
  const el = document.getElementById('visitCount');
  if (el) el.textContent = visitorCount != null ? visitorCount.toLocaleString() : '-';
  const el2 = document.getElementById('visitUV');
  if (el2) el2.textContent = visitorUV != null ? visitorUV.toLocaleString() : '-';
}

function fetchVisitorCount() {
  let retries = 15;
  function poll() {
    const pvEl = document.getElementById('busuanzi_value_site_pv');
    const uvEl = document.getElementById('busuanzi_value_site_uv');
    const pv = pvEl && pvEl.textContent ? parseInt(pvEl.textContent.replace(/,/g, ''), 10) : null;
    const uv = uvEl && uvEl.textContent ? parseInt(uvEl.textContent.replace(/,/g, ''), 10) : null;
    if (pv != null && !isNaN(pv)) {
      visitorCount = pv;
      visitorUV = (uv != null && !isNaN(uv)) ? uv : null;
      updateVisitorDisplay();
    } else if (retries > 0) {
      retries--;
      setTimeout(poll, 1000);
    } else {
      // Fallback: localStorage local counter
      const key = 'top-skills-visits';
      let n = parseInt(localStorage.getItem(key) || '0', 10);
      if (isNaN(n)) n = 0;
      n += 1;
      localStorage.setItem(key, n);
      visitorCount = n;
      visitorUV = null;
      updateVisitorDisplay();
    }
  }
  poll();
}

function destroyChart(name) {
  if (window._charts[name]) {
    window._charts[name].destroy();
    delete window._charts[name];
  }
}

function destroyAllCharts() {
  Object.keys(window._charts).forEach(destroyChart);
}

async function loadData() {
  // Start visitor counter in parallel
  fetchVisitorCount();
  const resp = await fetch('data/skills.json');
  DATA = await resp.json();
  initApp();
}

// ======================================================================
//  Utilities
// ======================================================================
function fmtDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleDateString(currentLang === 'zh' ? 'zh-CN' : 'en-US', { year:'numeric', month:'2-digit', day:'2-digit' });
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

function esc(s) { return String(s).replace(/[&<>"']/g, ''); }
function truncate(s, n) { return s && s.length > n ? s.slice(0, n) + '…' : s; }
function getBilingualDesc(desc, lang) {
  if (!desc) return '';
  const parts = desc.split(' / ');
  if (parts.length <= 1) return desc;
  return (parts[lang === 'zh' ? 1 : 0] || parts[0]).trim();
}

// ======================================================================
//  Markdown (simple)
// ======================================================================
function renderMarkdown(md) {
  if (!md) return '';
  let html = esc(md);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(?:<li>.*<\/li>\n?)+/g, (m) => {
    if (!m.includes('<ol>')) return '<ol>' + m + '</ol>';
    return m;
  });
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p><\/p>/g, '');
  return html;
}

// ======================================================================
//  Init
// ======================================================================
function initApp() {
  const { stats, skills, timeline } = DATA;

  // Header
  document.getElementById('headerTotal').textContent = stats.total_skills;
  document.getElementById('headerUpdate').textContent = fmtDate(stats.generated_at);

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('tab-' + tab).classList.add('active');
      if (tab === 'browse') renderBrowse();
      if (tab === 'trends') renderTrends();
    });
  });

  // Modal close
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('skillModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  // Apply i18n
  applyLang();

  // Setup browse
  setupBrowse(skills);
}

      <thead><tr>
        <th>${t('colSource')}</th>
        <th>${t('colRepo')}</th>
        <th>${t('colDesc')}</th>
        <th>${t('colSkills')}</th>
        <th>${t('colShare')}</th>

  document.getElementById('sourceTable').innerHTML = tableHtml;
}

// ======================================================================
//  Browse
// ======================================================================
let filteredSkills = [];
let currentPage = 1;
const PAGE_SIZE = 24;

function setupBrowse(skills) {
  filteredSkills = [...skills];

  const sources = [...new Set(skills.map(s => s.source))];
  const sel = document.getElementById('sourceFilter');
  sources.sort().forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });

  document.getElementById('searchInput').addEventListener('input', () => { currentPage=1; renderBrowse(); });
  document.getElementById('sourceFilter').addEventListener('change', () => { currentPage=1; renderBrowse(); });
  document.getElementById('sortSelect').addEventListener('change', () => { currentPage=1; renderBrowse(); });

  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderBrowse();
    });
  });

  renderBrowse();
}

function renderBrowse() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const source = document.getElementById('sourceFilter').value;
  const sort = document.getElementById('sortSelect').value;
  const view = document.querySelector('.view-btn.active')?.dataset?.view || 'grid';
  const container = document.getElementById('skillsContainer');

  let list = DATA.skills.filter(s => {
    if (source && s.source !== source) return false;
    if (query) {
      const q = query.toLowerCase();
      return s.name.toLowerCase().includes(q) || s.description.toLowerCase().includes(q) ||
             s.title.toLowerCase().includes(q);
    }
    return true;
  });

  list.sort((a, b) => {
    switch (sort) {
      case 'name': return a.name.localeCompare(b.name);
      case '-name': return b.name.localeCompare(a.name);
      case 'updated': return (b.updated || '').localeCompare(a.updated || '');
      case 'first_seen': return (b.first_seen || '').localeCompare(a.first_seen || '');
      case 'files': return (b.files || 0) - (a.files || 0);
      default: return 0;
    }
  });

  filteredSkills = list;
  const total = list.length;
  const totalPages = Math.ceil(total / PAGE_SIZE);
  if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = list.slice(start, start + PAGE_SIZE);

  document.getElementById('resultCount').textContent = t('resultCount').replace('{n}', total);

  if (list.length === 0) {
    container.innerHTML = '<div class="no-data">' + t('noMatch') + '</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  container.className = 'skills-grid ' + view;
  container.innerHTML = page.map(s => `
    <div class="skill-card${view === 'list' ? ' list' : ''}" onclick="showSkill('${esc(s.key)}')">
      <div>
        <div class="skill-name">
          ${esc(s.title || s.name)}
          <span class="skill-source">${esc(s.source)}</span>
          ${s.source_repo ? `<a class="repo-link" href="https://github.com/${esc(s.source_repo)}/tree/${esc((DATA.stats.source_branches||{})[s.source]||'main')}/${esc(s.repo_dir||'')}" target="_blank" title="View repo" onclick="event.stopPropagation()">↗</a>` : ''}
        </div>
        <div class="skill-desc">${esc(truncate(s.description, 150))}</div>
      </div>
      <div class="skill-meta${view === 'list' ? ' list' : ''}">
        <span>📄 ${s.files} ${t('files')}</span>
        <span>⏱ ${s.read_time || '-'} ${t('minutes')}</span>
        <span>🕐 ${fmtDate(s.updated)}</span>
      </div>
    </div>
  `).join('');

  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }

  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage<=1?'disabled':''}>‹</button>`;

  const range = 2;
  const start = Math.max(1, currentPage - range);
  const end = Math.min(totalPages, currentPage + range);

  if (start > 1) html += `<button class="page-btn" onclick="goPage(1)">1</button>`;
  if (start > 2) html += `<span class="page-info">…</span>`;

  for (let i = start; i <= end; i++) {
    html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }

  if (end < totalPages - 1) html += `<span class="page-info">…</span>`;
  if (end < totalPages) html += `<button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`;

  html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages?'disabled':''}>›</button>`;
  el.innerHTML = html;
}

function goPage(p) { currentPage = p; renderBrowse(); window.scrollTo({top: 200, behavior: 'smooth'}); }

// ======================================================================
//  Skill Detail Modal
// ======================================================================
function showSkill(key) {
  const skill = DATA.skills.find(s => s.key === key);
  if (!skill) return;

  document.getElementById('modalTitle').innerHTML = `${esc(skill.title || skill.name)} <span style="font-size:0.8rem;color:var(--text-dim);font-weight:400">${esc(skill.source)}</span>`;

  document.getElementById('modalSubtitle').innerHTML = `
    ${skill.description ? esc(skill.description) : ''}<br>
    <span style="color:var(--text-dim);font-size:0.8rem">
      ${t('modalSource')}: ${skill.source_repo || skill.source} · ${skill.files} ${t('modalFiles')} · ⏱ ${skill.read_time || '-'} ${t('modalReadTime')}
      · ${t('modalAdded')}: ${fmtDate(skill.first_seen)} · ${t('modalUpdated')}: ${fmtDate(skill.updated)}
      ${skill.source_repo ? ` · <a href="https://github.com/${esc(skill.source_repo)}/tree/${esc((DATA.stats.source_branches||{})[skill.source]||'main')}/${esc(skill.repo_dir||'')}" target="_blank" style="color:var(--accent)">${t('viewRepo')}</a>` : ''}
    </span>
  `;

  document.getElementById('modalBodyOriginal').innerHTML = skill.content_snippet ?
    renderMarkdown(skill.content_snippet) : '<p class="no-data">' + t('noContent') + '</p>';

  document.getElementById('modalBodyChinese').innerHTML = skill.cn_summary ?
    renderMarkdown(skill.cn_summary) : '<p class="no-data">' + t('noSummary') + '</p>';

  const fileList = skill.file_list || [];
  document.getElementById('modalFiles').innerHTML = fileList.length > 0 ? `
    <h4>${t('fileList').replace('{n}', fileList.length)}</h4>
    <div class="file-list">
      ${fileList.map(f => {
        const fileUrl = `../skills/${skill.source}/${skill.name}/${f.name}`;
        return `<a href="${fileUrl}" class="file-tag" target="_blank">${esc(f.name)} (${fmtSize(f.size)})</a>`;
      }).join('')}
    </div>
  ` : '';

  document.querySelectorAll('.modal-tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.modal-tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector('.modal-tab-btn[data-mtab="original"]').classList.add('active');
  document.getElementById('modalBodyOriginal').classList.add('active');

  document.getElementById('skillModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('skillModal').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('click', function(e) {
  const btn = e.target.closest('.modal-tab-btn');
  if (!btn) return;
  if (!document.getElementById('skillModal').classList.contains('open')) return;

  document.querySelectorAll('.modal-tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.modal-tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  const tab = btn.dataset.mtab;
  document.getElementById('modalBody' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
});

// ======================================================================
//  Trends
// ======================================================================
function renderTrends() {
  const tl = DATA.timeline;
  const perSource = DATA.per_source_timeline || {};
  const sourceActivity = DATA.source_activity || {};

  if ((!tl || tl.length === 0) && Object.keys(perSource).every(k => perSource[k].length === 0)) {
    document.querySelector('#tab-trends .trend-charts').innerHTML =
      '<div class="no-data">' + t('noTimeline') + '</div>';
    return;
  }

  renderDailyChart(tl);
  renderSourceTrendChart(perSource);
  renderHotRepos(sourceActivity, DATA.stats || {});
}

function renderDailyChart(tl) {
  destroyChart('dailyChart');
  const canvas = document.getElementById('dailyChart');
  if (!canvas) return;

  if (!tl || tl.length === 0) {
    canvas.parentElement.innerHTML = '<div class="no-data">' + t('noDaily') + '</div>';
    return;
  }

  try {
    const ctx = canvas.getContext('2d');
    window._charts.dailyChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: tl.map(t => t.date),
        datasets: [{
          label: t('dailyLabel'),
          data: tl.map(t => t.added),
          backgroundColor: 'rgba(88,166,255,0.7)',
          borderColor: '#58a6ff', borderWidth: 1,
          borderRadius: 3,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: '#21262d' } },
          y: { ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: '#21262d' }, beginAtZero: true }
        },
        plugins: {
          legend: { labels: { color: '#8b949e', font: { size: 11 } } }
        }
      }
    });
  } catch (e) { console.warn('dailyChart error:', e); }
}

function renderSourceTrendChart(perSource) {
  destroyChart('sourceTrendChart');
  const canvas = document.getElementById('sourceTrendChart');
  if (!canvas) return;

  const sourceKeys = Object.keys(perSource).filter(k => perSource[k].length > 0);
  if (sourceKeys.length === 0) {
    canvas.parentElement.innerHTML = '<div class="no-data">' + t('noPerSource') + '</div>';
    return;
  }

  const allDates = [...new Set(sourceKeys.flatMap(src => perSource[src].map(e => e.date)))].sort();
  const colors = ['#58a6ff','#3fb950','#d29922','#bc8cff','#f78166','#79c0ff','#ff7b72'];

  const datasets = sourceKeys.map((src, i) => {
    const dateMap = {};
    perSource[src].forEach(e => { dateMap[e.date] = e.added; });
    return {
      label: src,
      data: allDates.map(d => dateMap[d] || 0),
      backgroundColor: colors[i % colors.length],
    };
  });

  try {
    const ctx = canvas.getContext('2d');
    window._charts.sourceTrendChart = new Chart(ctx, {
      type: 'bar',
      data: { labels: allDates, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { stacked: true, ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: '#21262d' } },
          y: { stacked: true, ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: '#21262d' }, beginAtZero: true }
        },
        plugins: {
          legend: { position: 'bottom', labels: { color: '#8b949e', font: { size: 10 }, padding: 12 } }
        }
      }
    });
  } catch (e) { console.warn('sourceTrendChart error:', e); }
}

function renderHotRepos(activity, stats) {
  const el = document.getElementById('hotRepos');
  if (!el) return;

  const entries = Object.entries(activity).sort((a, b) => b[1].added - a[1].added);
  if (entries.length === 0) {
    el.innerHTML = '<div class="no-data">' + t('noActivity') + '</div>';
    return;
  }

  const maxAdded = Math.max(...entries.map(e => e[1].added), 1);
  const colors = ['#58a6ff','#3fb950','#d29922','#bc8cff','#f78166','#79c0ff'];
  const descs = stats.source_descriptions || {};

  el.innerHTML = `
    <table class="source-table">
      <thead><tr>
        <th>${t('colRank')}</th>
        <th>${t('colSource')}</th>
        <th>${t('colRepo')}</th>
        <th>${t('colDesc')}</th>
        <th>${t('colNewSkills')}</th>
        <th>${t('colCommits')}</th>
        <th>${t('colLastActive')}</th>
        <th>${t('colShare')}</th>
      </tr></thead>
      <tbody>
        ${entries.map(([key, val], i) => {
          const repo = (stats.source_repos && stats.source_repos[key]) || key;
          const pct = (val.added / stats.total_skills * 100).toFixed(1);
          const w = (val.added / maxAdded * 100).toFixed(0);
          const top = i < 3;
          const desc = descs[key] || '';
          return `<tr>
            <td><span style="font-weight:${top?'700':'400'};color:${top?'var(--accent)':'var(--text)'}">#${i+1}</span></td>
            <td><strong>${key}</strong></td>
            <td style="color:var(--text-dim);font-size:0.8rem">${repo}</td>
            <td style="color:var(--text-dim);font-size:0.8rem;max-width:260px">${getBilingualDesc(desc, currentLang)}</td>
            <td><strong>${val.added}</strong></td>
            <td>${val.commits}</td>
            <td>${fmtDate(val.last_seen)}</td>
            <td>
              <div style="display:flex;align-items:center;gap:8px">
                <div class="source-bar" style="width:${w}%;background:${colors[i % colors.length]}"></div>
                <span style="color:var(--text-dim);font-size:0.78rem">${pct}%</span>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}
