# ============================================================
# TOP-SKILLS Configuration
# ============================================================
# GitHub sources to monitor for Claude Code skills
# Each entry: {repo, branch, base_path} where skills are located

sources:
  - repo: anthropics/skills
    branch: main
    base_path: ""  # SKILL.md files at repo root or subdirs

  - repo: trailofbits/skills
    branch: main
    base_path: ""

  - repo: robertguss/claude-code-toolkit
    branch: main
    base_path: ""

  - repo: YYH211/Claude-meta-skill
    branch: main
    base_path: ""

  - repo: OneWave-AI/claude-skills
    branch: main
    base_path: ""

  - repo: aiskillstore/marketplace
    branch: main
    base_path: ""

  - repo: Prat011/awesome-llm-skills
    branch: main
    base_path: ""

# GitHub API settings
github:
  # Optional: set GITHUB_TOKEN env var or fill here
  token: ""
  # Search queries to find new skill repositories
  search_queries:
    - "topic:claude-code-skill"
    - "topic:claude-skills"
    - "SKILL.md+claude+code+skills"
    - "claude-code+skill+SKILL.md"

# Verification rules
verification:
  # Max file size in bytes (10MB)
  max_file_size: 10485760
  # Max skill directory size (100MB)
  max_skill_size: 104857600
  # Allowed file extensions in skills
  allowed_extensions:
    - .md
    - .py
    - .js
    - .ts
    - .sh
    - .json
    - .yaml
    - .yml
    - .toml
    - .txt
    - .csv
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .svg
    - .css
    - .html
    - .pdf
    - .drawio
  # Blocked patterns (regex) in skill content
  blocked_patterns:
    - "(?i)curl\\s+(?:-s|-k|-L)?\\s*\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b"  # curl to raw IPs
    - "(?i)wget\\s+(?:-q|-O)?\\s*\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b"    # wget to raw IPs
    - "(?i)(?:bash|sh|powershell|cmd)\\s+-c\\s+['\"]\\s*(?:curl|wget|iwr)"  # remote script execution
    - "eval\\(\\s*(?:os\\.system|subprocess|exec|compile)"
    - "__import__\\s*\\(\\s*['\"]os['\"]\\s*\\)\\.system"  # dynamic import os
    - "base64.*decode.*\\b(?:bash|sh|python|powershell)"  # base64 encoded scripts
    - "(?i)git\\s+clone\\s+https://raw\\.githubusercontent\\.com"  # raw remote execution

# Pipeline settings
pipeline:
  max_skills_per_run: 500
  max_total_skills: 2000  # Hard limit on total collection size
  log_retention_days: 30
